<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>La orquesta sinfónica</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Playfair+Display:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--paper:#F9F5E9;--card:#FFFDF8;--ink:#2B1B17;--ink2:#665049;--burg:#7A2433;--burg2:#5E1B28;--line:#E2D6BE;--line2:#CDBF9F;
--do:#D8263D;--re:#F0923B;--mi:#E8B922;--fa:#70BE8F;--sol:#1D4F43;--la:#7C5FA6;--si:#E88FBB;
--on-do:#fff;--on-re:#2B1B17;--on-mi:#2B1B17;--on-fa:#1B2A22;--on-sol:#fff;--on-la:#fff;--on-si:#2B1B17;
--okc:#17633A;--okb:#E6F4EA;--noc:#A3231B;--nob:#FBE9E7;--serif:'Playfair Display',Georgia,'Times New Roman',serif;--sans:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.5 var(--sans)}
#app{max-width:860px;margin:0 auto;padding:18px max(16px,env(safe-area-inset-right,0px)) 28px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--serif);margin:0;line-height:1.15;text-wrap:balance;color:var(--burg)}
h1{font-size:clamp(28px,6vw,42px)}h2{font-size:clamp(20px,4vw,26px)}h3{font-size:18px}
p{margin:0}
button,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--burg);outline-offset:2px}
.hero{position:relative;background:var(--card);border:1.5px solid var(--line);border-radius:22px;overflow:hidden;padding:20px 18px}
.staff{position:absolute;inset:0;background:repeating-linear-gradient(to bottom,transparent 0 11px,rgba(122,36,51,.13) 11px 12.5px);background-size:100% 62px;-webkit-mask-image:linear-gradient(90deg,transparent,#000 40%);mask-image:linear-gradient(90deg,transparent,#000 40%);opacity:.9}
.hbox{position:relative;display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.logo{width:150px;max-width:40%;flex:none;background:#fff;border:1.5px solid var(--line);border-radius:50%;padding:4px;line-height:0;overflow:hidden}
.logo img{width:100%;height:auto}
.hbox>div:last-child{display:flex;flex-direction:column;gap:8px;min-width:0;flex:1 1 240px}
.chip{align-self:flex-start;background:var(--burg);color:#fff;border-radius:999px;padding:3px 12px;font-size:14px;font-weight:700;letter-spacing:.03em}
.lead{color:var(--ink2)}
.scorebox{display:flex;gap:16px 28px;flex-wrap:wrap;align-items:center;justify-content:space-between;background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:14px 18px}
.scorebox>div{display:flex;flex-direction:column;gap:2px}
.scorebox small{color:var(--ink2);font-size:14px}
.big2{font:700 40px/1 var(--serif);color:var(--burg)}.big2 small{font:700 18px var(--sans);color:var(--ink2)}
.scale{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.scale li{display:flex;align-items:center;gap:8px}
.scale i{width:14px;height:14px;border-radius:50%;display:inline-block}.sf{background:var(--noc)}.sp{background:var(--okc)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.btn{border:2px solid var(--burg);background:var(--card);color:var(--burg);border-radius:12px;padding:10px 16px;font-weight:700;min-height:44px}
.btn:hover{background:#F3E7E3}
.btn.primary{background:var(--burg);color:#fff}.btn.primary:hover{background:var(--burg2)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.track{display:flex;flex-direction:column;gap:10px}
.gh{display:flex;gap:12px;align-items:center}
.gh p{color:var(--ink2);font-size:15px}
.nt{flex:none;width:min(72px,20vw);padding:4px;height:auto;border-radius:14px;border:1.5px solid var(--line);background:var(--card);padding:6px}
.levels{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:10px}
.lv{text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.lv:hover{border-color:var(--burg);box-shadow:0 3px 10px rgba(122,36,51,.12)}
.lv .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.lv .d{color:var(--ink2);font-size:15px}
.best{font-weight:700;color:var(--burg);white-space:nowrap}
.tags{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:auto}
.tag{background:#F3EBDA;border-radius:999px;padding:2px 10px;font-size:13px;color:var(--ink2)}
.vd{font-size:13px;font-weight:700;border-radius:999px;padding:2px 10px}
.vd.pass{background:var(--okb);color:var(--okc)}.vd.fail{background:var(--nob);color:var(--noc)}
.note{color:var(--ink2);font-size:14px}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.bar>b{font:700 18px var(--serif);color:var(--burg);flex:1 1 140px;min-width:0}
.meta{display:flex;gap:12px;color:var(--ink2);font-weight:700;font-size:15px}
.prog{height:8px;background:#EADFC8;border-radius:99px;overflow:hidden}
.prog div{height:100%;background:var(--burg);border-radius:99px;transition:width .25s}
.q{background:var(--card);border:1.5px solid var(--line);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:14px}
.stage{display:flex;flex-direction:column;gap:14px;align-items:stretch}
.stim{display:flex;flex-direction:column;align-items:center;gap:8px}
.art{width:min(100%,230px);aspect-ratio:1;border-radius:16px;border:1.5px solid var(--line);background:#fff;overflow:hidden;line-height:0}
.art img{width:100%;height:100%;object-fit:cover;display:block}
.art.sm{width:64px;flex:none;border-radius:12px}
.nm{font:700 20px var(--serif);color:var(--burg)}
.sub{color:var(--ink2);font-size:15px}
.pair{display:flex;gap:24px;flex-wrap:wrap;justify-content:center}
.pair .art{width:min(100%,200px)}
.speaker{width:92px;height:92px;border-radius:50%;border:3px solid var(--burg);background:var(--card);color:var(--burg);display:grid;place-items:center}
.speaker svg{width:42px;height:42px}
.speaker.playing{background:var(--burg);color:#fff}
.mini{display:inline-flex;gap:6px;align-items:center;border:1.5px solid var(--line2);background:var(--card);border-radius:999px;padding:5px 12px;font-size:14px;font-weight:700;color:var(--burg)}
.mini svg{width:16px;height:16px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
.opt,.mi{display:flex;align-items:center;gap:10px;text-align:left;background:var(--card);border:2px solid var(--line2);border-radius:14px;padding:10px 12px;min-height:52px;min-width:0}
.opt:hover:not(:disabled),.mi:hover:not(:disabled){border-color:var(--burg);background:#FBF3EF}
.opt .k,.bd{flex:none;min-width:28px;height:28px;border-radius:50%;background:#EFE4D6;color:var(--burg);display:grid;place-items:center;font-weight:700;font-size:14px;padding:0 4px}
.opt .mk,.mi .mk{margin-left:auto;font-weight:700}
.opt.ok,.mi.ok{background:var(--okb);border-color:var(--okc)}.opt.no,.mi.no{background:var(--nob);border-color:var(--noc)}
.opt.ok .mk,.mi.ok .mk{color:var(--okc)}.opt.no .mk,.mi.no .mk{color:var(--noc)}
.opt:disabled,.mi:disabled{cursor:default}
.cap{color:var(--ink2);font-size:15px}
.mgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px 14px}
.mcol{display:flex;flex-direction:column;gap:8px;min-width:0}
.mi{padding:8px 10px;font-size:16px}
.mi .mt{display:flex;align-items:center;gap:10px;min-width:0;flex-wrap:wrap;overflow-wrap:anywhere}
.mi .mt small{flex-basis:100%;color:var(--noc);font-size:13px;font-weight:700}
.mi .lt{font-weight:700}
.mi.sel{border-color:var(--burg);background:#F7E9E6;box-shadow:0 0 0 3px rgba(122,36,51,.2)}
.mi.r.used{border-color:var(--burg)}
.mi.r .bd:empty{visibility:hidden}
.cloze{font:500 20px/2.3 var(--serif)}
select.blank{font:600 16px var(--sans);border:2px solid var(--burg);border-radius:10px;background:#fff;color:var(--ink);padding:5px 8px;max-width:100%;min-height:40px}
.bk{padding:2px 8px;border-radius:8px;font-family:var(--sans);font-weight:700;font-size:17px}
.bk.ok{background:var(--okb);color:var(--okc)}.bk.no{background:var(--nob);color:var(--noc)}.bk s{font-weight:400}
.fb{border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.fb.good{background:var(--okb);color:#0F4A29}.fb.bad{background:var(--nob);color:#7C1A14}
.fb p{color:var(--ink)}
.pool{display:flex;gap:10px;flex-wrap:wrap}
.vcard{display:flex;flex-direction:column;align-items:center;gap:6px}
.pickb{border:2px solid var(--line2);background:var(--card);border-radius:14px;padding:6px;display:flex;flex-direction:column;gap:4px;align-items:center;font-weight:700;width:112px}
.pickb .art{width:92px}
.pickb:disabled{opacity:.35}
.slots{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.slot{min-height:46px;border:2px dashed var(--line2);border-radius:12px;display:flex;align-items:center;gap:8px;padding:6px 10px;font-weight:700}
.slot .n{flex:none;width:26px;height:26px;border-radius:50%;background:#EFE4D6;color:var(--burg);display:grid;place-items:center;font-size:14px}
.slot.fill{border-style:solid;border-color:var(--burg)}
.slot.ok{background:var(--okb);border-color:var(--okc)}.slot.no{background:var(--nob);border-color:var(--noc)}
.stage-photo{position:relative;width:100%;border-radius:14px;overflow:hidden;border:2px solid var(--line);background:#fff;line-height:0}
.stage-photo img{width:100%;height:auto;display:block}
.stage-photo svg{position:absolute;inset:0;width:100%;height:100%}
.stage-photo.tappable{cursor:crosshair;border-color:var(--burg)}
.zhl{fill:rgba(255,196,0,.30);stroke:#FFC400;stroke-width:6;animation:blink 1.1s ease-in-out infinite}
.zok{fill:rgba(30,160,90,.32);stroke:#1E9F5A;stroke-width:6}
.zpin{fill:rgba(190,40,40,.55);stroke:#B02626;stroke-width:4}.zpin.ok{fill:rgba(30,160,90,.55);stroke:#1E9F5A}
.zstudy{fill:rgba(122,36,51,.16);stroke:#fff;stroke-width:4}
.znum{fill:var(--burg);stroke:#fff;stroke-width:3}
.znt{fill:#fff;font:700 24px var(--sans);text-anchor:middle;dominant-baseline:central}
@keyframes blink{50%{fill:rgba(255,196,0,.08)}}
@media (prefers-reduced-motion:reduce){.zhl{animation:none}.prog div{transition:none}}
.legend{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:8px 24px;margin:14px 0 0;padding-left:22px}
.legend li{min-width:0}
.fam-h{display:flex;align-items:center;gap:10px;margin-top:8px}.fam-h i{width:14px;height:14px;border-radius:50%;background:var(--burg)}
.fd{color:var(--ink2)}
.grid-learn{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:6px;align-items:center;text-align:center;min-width:0}
.card:hover{border-color:var(--burg)}.card .art{width:100%}
.card small{color:var(--ink2);font-size:14px}
.card .tag{align-self:center}
.res{align-items:center;text-align:center}
.nota{display:flex;align-items:baseline;gap:6px;font-family:var(--serif)}
.nota .nn{font-size:84px;font-weight:700;line-height:1}.nota .of{font-size:26px;color:var(--ink2)}
.nota.pass .nn{color:var(--okc)}.nota.fail .nn{color:var(--noc)}
.res .vd{font-size:18px;padding:4px 16px}
.miss{text-align:left;width:100%;background:#F7F0E0;border-radius:14px;padding:12px 16px}
.miss ul{margin:6px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.foot{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:10px;color:var(--burg);font-weight:700}
.foot img{width:72px;height:auto;border-radius:50%;border:1px solid var(--line);background:#fff}
#toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;max-width:min(92vw,520px);z-index:10;font-size:15px}
@media (max-width:480px){.mi{font-size:15px}.mi .art.sm{width:52px}.cloze{font-size:18px}.nota .nn{font-size:72px}}
</style></head><body>

/* ---------- sonido: grabaciones reales ---------- */
/* Se decodifican con Web Audio desde los datos incrustados: no dependen de que el navegador deje cargar audio desde data: (Google Sites lo puede bloquear). */
let AC=null,cur=null,tok=0,toastT=0;const bufs={};
const clearPlaying=()=>document.querySelectorAll('.speaker.playing').forEach(e=>e.classList.remove('playing'));
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>{t.hidden=true},6000)}
function ctx(){
  if(!AC){const C=window.AudioContext||window.webkitAudioContext;if(C){try{AC=new C()}catch(e){AC=null}}}
  if(AC&&AC.state==='suspended'){try{AC.resume()}catch(e){}}
  return AC;
}
function unlock(){const c=ctx();if(c&&!unlock.done){unlock.done=true;try{const b=c.createBuffer(1,1,22050),s=c.createBufferSource();s.buffer=b;s.connect(c.destination);s.start(0)}catch(e){}}}
document.addEventListener('pointerdown',unlock,{capture:true});
document.addEventListener('keydown',unlock,{capture:true});
function toBuf(uri){const bin=atob(uri.slice(uri.indexOf(',')+1)),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u.buffer}
function decode(id){
  if(!bufs[id])bufs[id]=new Promise((res,rej)=>{const r=AC.decodeAudioData(toBuf(AU[id]),res,rej);if(r&&r.then)r.then(res,rej)}).catch(e=>{delete bufs[id];throw e});
  return bufs[id];
}
function stopSound(){tok++;if(cur){try{cur.stop()}catch(e){}cur=null}if(fb){try{fb.pause()}catch(e){}}clearPlaying()}
let fb=null;
function fallback(id){
  try{fb=fb||new Audio();fb.src=AU[id];document.querySelectorAll('.speaker').forEach(e=>e.classList.add('playing'));fb.onended=clearPlaying;
    const p=fb.play();if(p&&p.catch)p.catch(()=>{clearPlaying();toast('No se pudo reproducir el sonido. Sube el volumen del dispositivo o prueba con otro navegador.')})}
  catch(e){clearPlaying();toast('No se pudo reproducir el sonido. Sube el volumen del dispositivo o prueba con otro navegador.')}
}
async function play(id){
  if(!AU[id])return;stopSound();const my=tok,c=ctx();
  if(!c){fallback(id);return}
  document.querySelectorAll('.speaker').forEach(e=>e.classList.add('playing'));
  try{
    const buf=await decode(id);if(my!==tok)return;
    const s=c.createBufferSource();s.buffer=buf;s.connect(c.destination);
    s.onended=()=>{if(cur===s){cur=null;clearPlaying()}};cur=s;s.start(0);
  }catch(e){if(my!==tok)return;clearPlaying();fallback(id)}
}

    +(()=>{const r=ZONES[z].r[0],cx=(r[0]+r[2])/2,cy=(r[1]+r[3])/2;return `<circle class="znum" cx="${cx}" cy="${cy}" r="20"/><text class="znt" x="${cx}" y="${cy}">${k+1}</text>`})()).join('');
  return `<div class="stage-photo"><img src="${STAGE}" alt="Escenario de una orquesta sinfónica visto desde el público" width="1037" height="580"><svg viewBox="0 0 1037 580" preserveAspectRatio="none" aria-hidden="true">${shapes}</svg></div>
  <ol class="legend">${ids.map(z=>`<li><b>${ZONES[z].n}.</b> ${ZONES[z].loc}</li>`).join('')}</ol>`;
}
function learn(){
  stopSound();S={screen:'learn'};
  const sec=f=>`<div class="fam-h"><i></i><h2>${FAM[f].n}</h2></div><p class="fd">${FAM[f].d}</p>
   <div class="grid-learn">${INST.filter(i=>i.fam===f).map(i=>`<button class="card" data-act="play" data-snd="${i.id}" aria-label="${i.n}. Escuchar"><div class="art">${i.svg}</div><b>${i.n}</b><span class="tag">${HOWS[i.how]}${i.rank?' · '+RK[i.rank-1].toLowerCase():''}</span><small>${i.fact}</small><span class="mini">${ICON.spk}Escuchar</span></button>`).join('')}</div>`;
  app.innerHTML=`<div class="bar"><button class="btn" data-act="home">← Menú</button><b>Repaso</b></div>
  <p class="lead">Toca una tarjeta para oír el instrumento. La etiqueta indica cómo se toca y, en cuerda frotada, madera y metal, su tesitura dentro de la familia.</p>${FAMS.map(sec).join('')}
  <div class="fam-h"><i></i><h2>Dónde se coloca cada sección</h2></div>
  <p class="fd">Escenario visto desde el público. El director está en el centro, de frente a la orquesta.</p>${stageStudy()}${foot()}`;
}

function start(id){
  stopSound();const a=AB[id];
  const qs=B[id]();
  S={screen:'game',a,qs,n:qs.length,i:0,earned:0,max:qs.reduce((s,q)=>s+q.max,0),done:false,miss:[],sel:null,map:{},vals:[],pick:[]};
  renderGame();
}
function topBar(){
  return `<div class="bar"><button class="btn" data-act="home">← Menú</button><b>${S.a.gn} · ${S.a.t}</b><div class="meta"><span>${Math.min(S.i+1,S.n)} / ${S.n}</span><span>${S.earned} / ${S.max} pts</span></div></div>
  <div class="prog"><div style="width:${(S.i+(S.done?1:0))/S.n*100}%"></div></div>`;
}
const art=id=>`<div class="art">${IB[id].svg}</div>`;
const hearBtn=id=>`<button class="mini" data-act="play" data-snd="${id}">${ICON.spk}Escuchar</button>`;
function stagePhoto(q){
  const a=S.done,rects=(z,c)=>ZONES[z].r.map(r=>`<rect class="${c}" x="${r[0]}" y="${r[1]}" width="${r[2]-r[0]}" height="${r[3]-r[1]}" rx="10"/>`).join('');
  let ov='';
  if(q.type==='choice'&&q.stim.k==='stage')ov=rects(q.stim.zone,a?'zok':'zhl');
  if(q.type==='tap'&&a){ov=rects(q.zone,'zok');if(S.tap)ov+=`<circle class="zpin ${S.tapOk?'ok':''}" cx="${S.tap[0].toFixed(0)}" cy="${S.tap[1].toFixed(0)}" r="14"/>`}
  const tp=q.type==='tap'&&!a;
  return `<div class="stage-photo${tp?' tappable':''}" ${tp?'data-act="tap" role="button" aria-label="Foto del escenario: toca la zona"':''}><img src="${STAGE}" alt="Escenario de una orquesta sinfónica visto desde el público" width="1037" height="580"><svg viewBox="0 0 1037 580" preserveAspectRatio="none" aria-hidden="true">${ov}</svg></div>`;
}
function stimHtml(q){
  const s=q.stim,a=S.done;
  if(s.k==='none')return '';
  if(s.k==='stage')return stagePhoto(q);
  if(s.k==='pair')return `<div class="pair">${s.ids.map(id=>`<div class="stim">${art(id)}<div class="nm">${IB[id].n}</div>${hearBtn(id)}</div>`).join('')}</div>`;
  if(s.k==='sound'){
    if(!a)return `<div class="stim"><button class="speaker" data-act="play" data-snd="${s.id}" aria-label="Escuchar de nuevo">${ICON.spk}</button><span class="sub">Toca para escuchar otra vez</span></div>`;
    return `<div class="stim">${art(s.id)}<div class="nm">${IB[s.id].n}</div>${hearBtn(s.id)}</div>`;
  }
  return `<div class="stim">${art(s.id)}${a?`<div class="nm">${IB[s.id].n}</div>${hearBtn(s.id)}`:''}</div>`;
}
function renderGame(){
  if(S.i>=S.n)return result();
  const q=S.qs[S.i];S.q=q;S.done=false;S.chosen=null;S.tap=null;S.tapOk=false;S.sel=null;S.map={};S.vals=[];S.pick=[];S.res=null;
  if(q.type==='order')S.pool=shuf(q.set);
  if(q.type==='match')S.sel=q.L[0].id;
  paint();
  if(q.type==='choice'&&q.stim.k==='sound')setTimeout(()=>play(q.stim.id),250);
}
function fbHtml(ok,head,body){
  return `<div class="fb ${ok?'good':'bad'}" role="status"><b>${head}</b>${body?`<p>${body}</p>`:''}</div><div><button class="btn primary" data-act="next" id="nextBtn">${S.i+1>=S.n?'Ver resultados':'Siguiente'}</button></div>`;
}
function paint(){
  const q=S.q,a=S.done;let body='',fb='';
  if(q.type==='choice'||q.type==='tap'){
    const opts=q.opts?`<div class="opts">${q.opts.map((o,k)=>{let c='opt',mk='';
      if(a){if(o.id===q.ans){c+=' ok';mk='✓'}else if(o.id===S.chosen){c+=' no';mk='✗'}}
      return `<button class="${c}" data-act="ans" data-k="${k}" ${a?'disabled':''}><span class="k">${k+1}</span><span>${o.l}</span><span class="mk" aria-hidden="true">${mk}</span></button>`}).join('')}</div>`:'';
    body=`<div class="stage">${stimHtml(q)}${opts}</div>`;
    if(a){const ok=S.res.ok;fb=fbHtml(ok,ok?'¡Correcto! +1 punto':(q.type==='tap'?'No es ahí. La zona correcta está marcada en verde.':'No era esa. La respuesta correcta es '+q.opts.find(o=>o.id===q.ans).l+'.'),q.fact)}
  }else if(q.type==='match')body=paintMatch(),fb=a?fbHtml(S.res.k===q.max,`Has acertado ${S.res.k} de ${q.max}. +${S.res.k} ${S.res.k===1?'punto':'puntos'}`,q.fact):'';
  else if(q.type==='cloze')body=paintCloze(),fb=a?fbHtml(S.res.k===q.max,`Has acertado ${S.res.k} de ${q.max} huecos. +${S.res.k} ${S.res.k===1?'punto':'puntos'}`,q.fact):'';
  else if(q.type==='order')body=paintOrder(),fb=a?fbHtml(S.res.k===q.max,S.res.k===q.max?'¡Orden perfecto! +'+q.max+' puntos':`Colocaste bien ${S.res.k} de ${q.max}. +${S.res.k} ${S.res.k===1?'punto':'puntos'}`,'Orden correcto: '+S.res.sorted.map(v=>IB[v].n).join(' → ')):'';
  app.innerHTML=`${topBar()}<div class="q"><h2>${q.p}</h2>${body}${fb}</div>${foot()}`;
  if(a){const nb=document.getElementById('nextBtn');if(nb)nb.focus({preventScroll:true})}
}
/* --- unir --- */
function paintMatch(){
  const q=S.q,a=S.done,ok=id=>S.map[id]===q.ans[id];
  const used={};q.L.forEach((x,i)=>{const r=S.map[x.id];if(r)(used[r]=used[r]||[]).push(i+1)});
  const L=q.L.map((x,i)=>{let c='mi'+(S.sel===x.id&&!a?' sel':'')+(a?(ok(x.id)?' ok':' no'):'');
    const r=S.map[x.id];
    return `<button class="${c}" data-act="mL" data-id="${x.id}" ${a?'disabled':''}><span class="bd">${i+1}</span><span class="mt">${x.html}${a&&!ok(x.id)?`<small>Correcta: ${q.lab[q.ans[x.id]]}</small>`:''}</span>${a?`<span class="mk" aria-hidden="true">${ok(x.id)?'✓':'✗'}</span>`:''}</button>`}).join('');
  const R=q.R.map(r=>`<button class="mi r${used[r.id]?' used':''}" data-act="mR" data-id="${r.id}" ${a?'disabled':''}><span class="bd">${used[r.id]?used[r.id].join(','):''}</span><span class="mt">${r.l}</span></button>`).join('');
  const all=q.L.every(x=>S.map[x.id]);
  return `<p class="cap">${a?'Resultado':'Toca un elemento de la izquierda y después su pareja de la derecha. Puedes cambiar una unión volviendo a elegir.'}</p>
   <div class="mgrid"><div class="mcol">${L}</div><div class="mcol">${R}</div></div>
   ${a?'':`<div><button class="btn primary" data-act="mcheck" ${all?'':'disabled'}>Comprobar</button></div>`}`;
}
function mL(id){if(S.done)return;S.sel=S.sel===id?null:id;paint()}
function mR(id){
  if(S.done)return;const q=S.q;
  if(!S.sel){const o=q.L.find(x=>S.map[x.id]===id);if(o)S.sel=o.id;paint();return}
  q.L.forEach(x=>{if(S.map[x.id]===id&&x.id!==S.sel)delete S.map[x.id]});
  S.map[S.sel]=id;
  const nx=q.L.find(x=>!S.map[x.id]);S.sel=nx?nx.id:null;paint();
}
function mCheck(){
  if(S.done)return;const q=S.q;let k=0;
  q.L.forEach(x=>{if(S.map[x.id]===q.ans[x.id])k++;else S.miss.push({n:q.nm[x.id],a:q.lab[q.ans[x.id]]})});
  grade(k);
}
/* --- completar --- */
function paintCloze(){
  const q=S.q,a=S.done;
  const parts=q.t.map(p=>{
    if(typeof p==='string')return p;
    const b=q.b[p];
    if(!a)return `<select class="blank" data-act="sel" data-b="${p}" aria-label="Hueco ${p+1}"><option value="">elige…</option>${b.opts.map((o,k)=>`<option value="${k}" ${S.vals[p]===String(k)?'selected':''}>${o.l}</option>`).join('')}</select>`;
    const my=S.vals[p]!==undefined&&S.vals[p]!==''?b.opts[+S.vals[p]]:null,right=my&&my.id===b.ans,cor=b.opts.find(o=>o.id===b.ans).l;
    return right?`<span class="bk ok">${cor} ✓</span>`:`<span class="bk no">${my?`<s>${my.l}</s> ✗ `:''}<b>${cor}</b></span>`;
  }).join('');
  const all=q.b.every((_,i)=>S.vals[i]!==undefined&&S.vals[i]!=='');
  return `${q.img?`<div class="stim">${art(q.img)}</div>`:''}<p class="cloze">${parts}</p>${a?'':`<div><button class="btn primary" data-act="ccheck" id="ccheck" ${all?'':'disabled'}>Comprobar</button></div>`}`;
}
function cCheck(){
  if(S.done)return;const q=S.q;let k=0;
  q.b.forEach((b,i)=>{const v=S.vals[i],o=v!==undefined&&v!==''?b.opts[+v]:null;if(o&&o.id===b.ans)k++;else S.miss.push({n:q.t.map(p=>typeof p==='string'?p:'___').join('').replace(/\s+/g,' '),a:b.opts.find(x=>x.id===b.ans).l})});
  grade(k);
}
/* --- ordenar --- */
function paintOrder(){
  const q=S.q,a=S.done,sorted=q.set.slice().sort((x,y)=>IB[x].rank-IB[y].rank),n=q.set.length;
  const pool=S.pool.map(v=>`<div class="vcard"><button class="pickb" data-act="opick" data-id="${v}" ${S.pick.includes(v)||a?'disabled':''}><div class="art">${IB[v].svg}</div><span>${IB[v].n}</span></button><button class="mini" data-act="play" data-snd="${v}" aria-label="Escuchar ${IB[v].n}">${ICON.spk}</button></div>`).join('');
  const slots=[...Array(n)].map((_,i)=>{const v=S.pick[i];let c='slot'+(v?' fill':'');if(a&&v)c+=v===sorted[i]?' ok':' no';
    return `<div class="${c}"><span class="n">${i+1}</span>${v?IB[v].n+(a?(v===sorted[i]?' ✓':' ✗'):''):''}</div>`}).join('');
  return `<div><p class="cap">Toca los instrumentos en orden. Usa el altavoz para escucharlos.</p><div class="pool">${pool}</div></div>
   <div><p class="cap">Tu orden (de más agudo a más grave)</p><div class="slots">${slots}</div></div>
   ${!a?`<div><button class="btn" data-act="oundo" ${S.pick.length?'':'disabled'}>Deshacer último</button></div>`:''}`;
}
function orderPick(v){
  if(S.done||S.pick.includes(v))return;S.pick.push(v);const q=S.q;
  if(S.pick.length===q.set.length){
    const sorted=q.set.slice().sort((x,y)=>IB[x].rank-IB[y].rank);let k=0;S.pick.forEach((x,i)=>{if(x===sorted[i])k++});
    if(k<q.max)S.miss.push({n:q.p,a:sorted.map(x=>IB[x].n).join(' → ')});
    S.res={sorted};grade(k);return;
  }
  paint();
}
/* --- calificación --- */
function grade(k){
  S.earned+=k;S.done=true;S.res=Object.assign(S.res||{},{k});paint();
}
function answer(k){
  if(S.done)return;const q=S.q,o=q.opts[k];S.chosen=o.id;
  const ok=o.id===q.ans;S.earned+=ok?1:0;
  if(!ok)S.miss.push({n:q.stim.id?IB[q.stim.id].n+' · '+q.p:(q.stim.ids?'Pareja de instrumentos':q.p),a:q.opts.find(x=>x.id===q.ans).l});
  S.done=true;S.res={ok};paint();
}
function tapAnswer(x,y){
  if(S.done)return;const q=S.q,ok=ZONES[q.zone].r.some(r=>x>=r[0]&&x<=r[2]&&y>=r[1]&&y<=r[3]);
  S.tap=[x,y];S.tapOk=ok;S.earned+=ok?1:0;if(!ok)S.miss.push({n:ZONES[q.zone].n,a:ZONES[q.zone].loc});
  S.done=true;S.res={ok};paint();
}
function next(){S.i++;S.done=false;renderGame()}
function result(){
  stopSound();
  const acc=S.earned/S.max,nota=Math.max(1,Math.round(acc*10)),pass=nota>=5;
  saveN(S.a.id,nota);S.screen='result';
  const msg=nota>=9?'Excelente. Dominas esta actividad.':nota>=7?'Muy bien. Vas por buen camino.':nota>=5?'Aprobado. Repasa los fallos para mejorar la nota.':'Suspenso. Repasa las tarjetas y vuelve a intentarlo.';
  app.innerHTML=`<div class="bar"><button class="btn" data-act="home">← Menú</button><b>${S.a.gn} · ${S.a.t}</b></div>
  <div class="q res"><h2>Resultado</h2><div class="nota ${pass?'pass':'fail'}"><span class="nn">${nota}</span><span class="of">/ 10</span></div>${veredicto(nota)}
  <p style="margin:0">${S.earned} de ${S.max} puntos (${Math.round(acc*100)} %). ${msg}</p>
  <div class="row" style="justify-content:center"><button class="btn primary" data-act="start" data-id="${S.a.id}">Repetir actividad</button><button class="btn" data-act="home">Otras actividades</button><button class="btn" data-act="learn">Repasar</button></div>
  ${S.miss.length?`<div class="miss"><p class="cap">Para repasar</p><ul>${S.miss.map(m=>`<li><b>${m.n}</b>: ${m.a}</li>`).join('')}</ul></div>`:''}</div>${foot()}`;
  window.scrollTo(0,0);
}

/* ---------- eventos ---------- */
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b||b.disabled||b.tagName==='SELECT')return;
  const a=b.dataset.act;
  if(a==='home')home();else if(a==='learn')learn();else if(a==='start')start(b.dataset.id);
  else if(a==='play')play(b.dataset.snd);else if(a==='ans')answer(+b.dataset.k);else if(a==='next')next();
  else if(a==='mL')mL(b.dataset.id);else if(a==='mR')mR(b.dataset.id);else if(a==='mcheck')mCheck();else if(a==='ccheck')cCheck();
  else if(a==='opick')orderPick(b.dataset.id);else if(a==='oundo'){S.pick.pop();paint()}
  else if(a==='tap'){const r=b.getBoundingClientRect();tapAnswer((e.clientX-r.left)/r.width*1037,(e.clientY-r.top)/r.height*580)}
});
document.addEventListener('change',e=>{
  const s=e.target;if(!s.classList||!s.classList.contains('blank'))return;
  S.vals[+s.dataset.b]=s.value;
  const btn=document.getElementById('ccheck');if(btn)btn.disabled=!S.q.b.every((_,i)=>S.vals[i]!==undefined&&S.vals[i]!=='');
});
document.addEventListener('keydown',e=>{
  if(S.screen!=='game'||!S.q||e.ctrlKey||e.metaKey||e.altKey||e.target.tagName==='SELECT')return;
  if(S.q.type==='choice'&&!S.done&&/^[1-6]$/.test(e.key)&&S.q.opts[+e.key-1])answer(+e.key-1);
});
home();
</script>
